[project]
name = "istanbul-city-pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MuhammedKeremDemirbent", email = "keremdmrbnt03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "duckdb>=2.0.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
istanbul-city-pulse = "istanbul_city_pulse:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dbt = [
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
ml = [
    "lightgbm>=4.7.0",
    "mlflow>=1.27.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]
quality = [
    "great-expectations>=1.24.1",
]
